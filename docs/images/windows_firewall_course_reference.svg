<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#f3f6fa"/>
<text x="52" y="59" font-size="31" font-family="Arial" font-weight="bold" fill="#24344b">Windows Defender Firewall — course reference</text>
<text x="52" y="90" font-size="18" font-family="Arial" fill="#53657a">Illustration of the sequence shown in the provided training screenshots</text>
<g font-family="Arial" fill="#263b56">
<rect x="52" y="135" width="472" height="189" rx="12" fill="white" stroke="#b8c6d8" stroke-width="2"/>
<text x="74" y="173" font-weight="bold" font-size="24">1. Find the firewall settings</text>
<rect x="74" y="195" width="427" height="45" rx="7" fill="#edf3fa" stroke="#c5d4e5"/>
<text x="90" y="224" font-size="20">Search: windows firewall</text>
<text x="74" y="279" font-size="19">Windows Defender Firewall</text>
<rect x="576" y="135" width="472" height="189" rx="12" fill="white" stroke="#b8c6d8" stroke-width="2"/>
<text x="598" y="173" font-weight="bold" font-size="24">2. Open network settings</text>
<text x="598" y="219" font-size="19">Turn Windows Defender Firewall</text>
<text x="598" y="245" font-size="19">on or off</text>
<rect x="52" y="351" width="472" height="220" rx="12" fill="white" stroke="#b8c6d8" stroke-width="2"/>
<text x="74" y="389" font-weight="bold" font-size="24">3. Training configuration</text>
<g font-size="19"><text x="74" y="432">Domain network: Off</text><text x="74" y="470">Private network: Off</text><text x="74" y="508">Public network: Off</text></g>
<rect x="576" y="351" width="472" height="220" rx="12" fill="white" stroke="#b8c6d8" stroke-width="2"/>
<text x="598" y="389" font-weight="bold" font-size="24">4. Verify displayed state</text>
<g font-size="19"><text x="598" y="432">All three network profiles:</text><text x="598" y="470" fill="#a33025">Firewall Off (course example)</text><text x="598" y="517" fill="#476079">Restore protection after training</text></g></g>
<text x="52" y="614" font-family="Arial" font-size="17" fill="#53657a">Recreated teaching illustration — not a direct screenshot or proof of completed changes.</text>
</svg>